name: Rebuild niche templates ZIP

on:
  push:
    branches: [main]
    paths:
      - "site-pages/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ZIP with published pages
        run: |
          cp site-pages/mais_5_landing_pages/theme.css mais_5_landing_pages/theme.css
          for folder in 04-imobiliaria 05-clinica-estetica 06-curso-online 07-fotografo 08-saas; do
            cp "site-pages/mais_5_landing_pages/$folder/index.html" "mais_5_landing_pages/$folder/index.html"
          done
          zip -qr -FS mais-5-templates-landing-pages.zip mais_5_landing_pages
      - name: Commit updated ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mais-5-templates-landing-pages.zip
          git commit -m "Atualiza pacote ZIP com landing pages especializadas" || exit 0
          git push
