name: Rebuild niche templates ZIP

on:
  push:
    branches: [main]
    paths:
      - "site-pages/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ZIP packages from published source
        run: |
          rm -rf landing_pages_vendaveis mais_5_landing_pages
          cp -R site-pages/landing_pages_vendaveis ./landing_pages_vendaveis
          cp -R site-pages/mais_5_landing_pages ./mais_5_landing_pages
          zip -qr 3-templates-landing-pages-vendaveis.zip landing_pages_vendaveis
          zip -qr mais-5-templates-landing-pages.zip mais_5_landing_pages
          rm -rf landing_pages_vendaveis mais_5_landing_pages
      - name: Commit updated ZIP packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3-templates-landing-pages-vendaveis.zip mais-5-templates-landing-pages.zip
          git commit -m "Atualiza pacotes ZIP com os oito nichos" || exit 0
          git push
